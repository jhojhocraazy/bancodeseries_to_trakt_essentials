[project]
name = "bancodeseries-to-trakt-essentials"
version = "0.1.0"
description = "Exportador local de histórico do Banco de Séries para CSV compatível com o Trakt."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "rich>=13.7.0",
  "urllib3>=2.0",
]

[project.scripts]
bancodeseries-to-trakt-essentials = "bancodeseries_to_trakt_essentials:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
